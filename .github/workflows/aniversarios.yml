name: Verificar Aniversários

on:
  schedule:
    # Roda todo dia às 07:00 horário de Brasília (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite executar manualmente

jobs:
  verificar-aniversarios:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para fazer commit e push
      secrets: read    # Permissão para ler secrets (se necessário)
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Instalar dependências
      run: |
        pip install -r requirements.txt
    
    - name: Executar script de aniversários
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        API_KEY_BOTCONVERSA: ${{ secrets.API_KEY_BOTCONVERSA }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python msys_bot.py

