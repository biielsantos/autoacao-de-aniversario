name: Verificar Aniversários

on:
  schedule:
    # Roda diariamente às 07:00 (horário de Brasília = UTC-3, então 10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Permite execução manual

permissions:
  contents: write  # Necessário para fazer commit/push do token atualizado

jobs:
  verificar-aniversarios:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          cd github
          pip install -r requirements.txt
      
      - name: Executar script de aniversários
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          API_KEY_BOTCONVERSA: ${{ secrets.API_KEY_BOTCONVERSA }}
        run: |
          cd github
          python msys_bot.py

