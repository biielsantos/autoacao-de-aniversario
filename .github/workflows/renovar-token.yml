name: Renovar Refresh Token

on:
  schedule:
    # Roda a cada 2h, mas PULA as horas 10 e 12 UTC (07h e 09h Brasil)
    # Horas UTC: 0, 2, 4, 6, 8, [pula 10, 12], 14, 16, 18, 20, 22
    - cron: '0 0,2,4,6,8,14,16,18,20,22 * * *'
  workflow_dispatch:  # Permite execução manual

permissions:
  contents: write  # Necessário para fazer commit/push

jobs:
  renovar-token:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
      
      - name: Renovar refresh_token
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          API_KEY_BOTCONVERSA: ${{ secrets.API_KEY_BOTCONVERSA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python msys_bot.py --renovar
